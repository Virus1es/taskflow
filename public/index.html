<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TaskFlow — менеджер задач</title>
        <link rel="stylesheet" href="/styles.css">
        <script type="module" src="/app.js"></script>
    </head>
    <body>
        <main class="container">
            <header>
                <h1>TaskFlow</h1>
                <p>Менеджер задач на Express и PostgreSQL</p>
            </header>

            <section id="auth-section" class="card">
                <h2>Авторизация</h2>

                <form id="auth-form">
                    <label for="token">Bearer-токен</label>
                    <input
                            id="token"
                            type="password"
                            autocomplete="off"
                            required
                            placeholder="Введите токен"
                    >
                    <button type="submit">Войти</button>
                </form>
            </section>

            <section id="tasks-section" hidden>
                <div class="card">
                    <div class="section-heading">
                        <div>
                            <h2 id="author-name"></h2>
                            <p id="author-login"></p>
                        </div>
                        <button id="logout-button" type="button">
                            Выйти
                        </button>
                    </div>
                </div>

                <div class="card">
                    <h2>Мои задачи</h2>

                    <label for="run-id">Группа задач (runId)</label>
                    <div class="controls">
                        <input
                                id="run-id"
                                value="manual"
                                maxlength="64"
                                required
                        >
                        <button id="load-button" type="button">
                            Загрузить
                        </button>
                    </div>

                    <form id="create-task-form">
                        <label for="task-title">Новая задача</label>

                        <div class="controls">
                            <input
                                    id="task-title"
                                    type="text"
                                    maxlength="200"
                                    required
                                    placeholder="Что нужно сделать?"
                            >

                            <button type="submit">Добавить</button>
                        </div>
                    </form>

                    <ul id="task-list"></ul>
                </div>
            </section>

            <p id="message" role="status" aria-live="polite"></p>
        </main>
    </body>
</html>
