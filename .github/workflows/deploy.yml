name: TaskFlow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cr.yandex/crp1lku1961752mnu8qb/taskflow
  APP_URL: https://bbac3ro71q4bds7oird2.containers.yandexcloud.net

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskflow:test_password@localhost:5432/taskflow
      API_TOKEN: ci_test_token
      MOODLE_LOGIN: troan
      MOODLE_FULL_NAME: Yakubenko Vadim
      PORT: 3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          PGPASSWORD=test_password psql \
            -h localhost \
            -U taskflow \
            -d taskflow \
            -v ON_ERROR_STOP=1 \
            -f db/init.sql

      - name: Start Express
        run: |
          node src/index.js > server.log 2>&1 &
          echo $! > server.pid
          
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/login/ > /dev/null; then
              exit 0
            fi
              sleep 1
          done
          
          cat server.log
          exit 1

      - name: Run integration tests
        run: npm test

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-ci-server-logs
          path: server.log
          if-no-files-found: ignore

  deploy:
      name: Build and deploy
      needs: test
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-latest

      permissions:
        contents: read
        id-token: write

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Inspect GitHub OIDC identity
          shell: bash
          run: |
            response=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2FVirus1es")
          
            jwt=$(echo "$response" | jq -r '.value')
          
            payload=$(echo "$jwt" | cut -d. -f2 | tr '_-' '/+')
            payload="${payload}$(printf '%*s' $(( (4 - ${#payload} % 4) % 4 )) '' | tr ' ' '=')"
        
            echo "$payload" | base64 -d | jq '{
              sub,
              aud,
              iss,
              repository,
              ref
            }'

        - name: Get Yandex Cloud IAM token
          id: yc-token
          uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
          with:
            yc-sa-id: ${{ secrets.YC_DEPLOY_SA_ID }}

        - name: Login to Yandex Container Registry
          uses: docker/login-action@v3
          with:
            registry: cr.yandex
            username: iam
            password: ${{ steps.yc-token.outputs.token }}

        - name: Build and push image
          uses: docker/build-push-action@v6
          with:
            context: .
            platforms: linux/amd64
            push: true
            provenance: false
            sbom: false
            tags: ${{ env.IMAGE }}:${{ github.sha }}

        - name: Deploy To Yandex Serverless Container
          uses: yc-actions/yc-sls-container-deploy@v5
          with:
            yc-iam-token: ${{ steps.yc-token.outputs.token }}
            container-name: taskflow
            folder-id: b1ghih3ae5ru0p5c9rdp
            revision-service-account-id: ${{ secrets.YC_RUNTIME_SA_ID }}
            revision-cores: 1
            revision-memory: 512Mb
            revision-execution-timeout: 30
            revision-image-url: cr.yandex/crp1lku1961752mnu8qb/taskflow:${{ github.sha }}
            revision-env: |
              NODE_ENV=production
              MOODLE_LOGIN=troan
              MOODLE_FULL_NAME=Yakubenko Vadim
            revision-secrets: |
              API_TOKEN=${{ vars.LOCKBOX_SECRET_ID }}/${{ vars.LOCKBOX_VERSION_ID }}/API_TOKEN
              DATABASE_URL=${{ vars.LOCKBOX_SECRET_ID }}/${{ vars.LOCKBOX_VERSION_ID }}/DATABASE_URL

        - name: Smoke test - public login
          run: |
            response=$(curl \
              --fail-with-body \
              --show-error \
              --silent \
              --retry 3 \
              --retry-delay 5 \
              "${APP_URL}/login/")
            
            echo "Response: $response"
            test "$response" = "troan"